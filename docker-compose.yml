version: '3.8'

services:
  # Database
  db:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME}_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # AI_Service
  ai_service:
    image: vanyas627/mental-health-ai_service:${IMAGE_TAG}
    container_name: ${PROJECT_NAME}_ai_service
    restart: always
    env_file:
      - ./ai_service/.env
    environment:
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}/0
    ports:
      - "${AI_SERVICE_PORT}:8001"
    depends_on:
      redis:
        condition: service_started

  #Change for testing Jira
  # Backend
  backend:
    image: vanyas627/mental-health-backend:${IMAGE_TAG}
    container_name: ${PROJECT_NAME}_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}/0
    volumes:
      - /opt/mental-health/media:/app/media
    ports:
      - "${BACKEND_PORT}:8000"
    healthcheck:
      test: [
        "CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai_service:
        condition: service_started

  celery_worker:
    image: vanyas627/mental-health-backend:${IMAGE_TAG}
    container_name: ${PROJECT_NAME}_celery_worker
    restart: always
    entrypoint: []
    command: celery -A tasks.celery_app:app worker --loglevel=info --concurrency=2
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}/0
      CELERY_BROKER_URL: redis://${REDIS_HOST}:${REDIS_PORT}/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    image: vanyas627/mental-health-backend:${IMAGE_TAG}
    container_name: ${PROJECT_NAME}_celery_beat
    restart: always
    entrypoint: []
    command: celery -A tasks.celery_app:app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}/0
      CELERY_BROKER_URL: redis://${REDIS_HOST}:${REDIS_PORT}/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend
  frontend:
    image: vanyas627/mental-health-frontend:${IMAGE_TAG}
    container_name: ${PROJECT_NAME}_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/letsencrypt:/var/www/letsencrypt:ro
      - /opt/mental-health/media:/usr/share/nginx/html/media:ro
    depends_on:
      - backend

  celery_worker:
    image: vanyas627/mental-health-backend:${IMAGE_TAG}
    container_name: ${PROJECT_NAME}_celery_worker
    command: [ "celery", "-A", "tasks.celery_app", "worker", "--loglevel=info", "--concurrency=2" ]
    env_file:
      - ./backend/.env
    environment:
      CELERY_BROKER_URL: redis://${REDIS_HOST}:${REDIS_PORT}/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    entrypoint: [ ]
    restart: always

  celery_beat:
    image: vanyas627/mental-health-backend:${IMAGE_TAG}
    container_name: ${PROJECT_NAME}_celery_beat
    command: [ "celery", "-A", "tasks.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule" ]
    env_file:
      - ./backend/.env
    environment:
      CELERY_BROKER_URL: redis://${REDIS_HOST}:${REDIS_PORT}/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    entrypoint: [ ]
    restart: always

volumes:
  postgres_data:
  redis_data: