version: '3.8'

services:
  # Database
  db:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME}_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mental_health_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: ${PROJECT_NAME}_pgadmin
    ports:
      - "3333:80"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - mental_health_network

  # AI_Service
  ai_service:
    build:
      context: ./ai_service
    container_name: ${PROJECT_NAME}_ai_service
    restart: always
    env_file:
      - ./ai_service/.env
    ports:
      - "${AI_SERVICE_PORT}:8001"
    volumes:
      - ./ai_service/app:/usr/ai_service_app
    depends_on:
      redis:
        condition: service_started
    networks:
      - mental_health_network

  # Backend
  backend:
    build:
      context: ./backend
    container_name: ${PROJECT_NAME}_backend
    restart: always
#    environment:
#      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./backend/app/database/migrations/versions:/app/database/migrations/versions
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mental_health_network

#  # Frontend
#  frontend:
#    build:
#      context: ./frontend
#    container_name: ${PROJECT_NAME}_frontend
#    restart: always
#    ports:
#      - "${FRONTEND_PORT}:80"
#    depends_on:
#      - backend

  # Redis for AI_Service
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}_redis
    restart: always
    env_file:
      - .env
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - mental_health_network


volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  mental_health_network: