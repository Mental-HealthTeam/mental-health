services:
  # Database
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for AI_Service
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "3333:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # AI_Service
  ai_service:
    build:
      context: ./ai_service
    restart: always
    ports:
      - "${AI_SERVICE_PORT}:8001"
    volumes:
      - ./ai_service/app:/usr/ai_service_app
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--reload"
      ]
    env_file:
      - ai_service/.env
    depends_on:
      redis:
        condition: service_healthy

  # Backend
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - avatars_data:/app/media/avatars
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: [
        "CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ai_service:
        condition: service_started

  # Frontend
  frontend:
   build:
     context: ./frontend
   restart: always
   ports:
     - "${FRONTEND_PORT}:80"
   volumes:
     - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
     - ./media:/usr/share/nginx/html/media:ro
   depends_on:
     - backend

  celery_worker:
    build:
      context: ./backend
    container_name: ${PROJECT_NAME}_celery_worker
    restart: always
    entrypoint: []
    command: celery -A tasks.celery_app:app worker --loglevel=info --concurrency=2
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}/0
      CELERY_BROKER_URL: redis://${REDIS_HOST}:${REDIS_PORT}/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
    container_name: ${PROJECT_NAME}_celery_beat
    restart: always
    entrypoint: []
    command: celery -A tasks.celery_app:app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}/0
      CELERY_BROKER_URL: redis://${REDIS_HOST}:${REDIS_PORT}/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  avatars_data:
    driver: local
